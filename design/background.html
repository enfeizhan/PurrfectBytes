<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fredoka:wght@600&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1280px;height:720px;overflow:hidden}svg{display:block}</style>
</head><body>
<!-- Study journal: dot-grid page with spiral binding, paw prints, washi tape carrying the name, and a
     Subscribe button. Opened as background.html?qr it also carries the note pointing at the PayPal QR
     code, which the web app draws at (20, 550), 150px square, and Android at (20, 580), 120px square, in the 1280x720 frame. -->
<svg width="1280" height="720" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="22" r="2.6" fill="#E9D2AA"/>
    </pattern>
    <pattern id="stripes" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="11" height="22" fill="#FFFFFF" opacity="0.28"/>
    </pattern>
    <g id="paw" fill="#E7B98A">
      <ellipse cx="0" cy="10" rx="22" ry="18"/>
      <circle cx="-24" cy="-14" r="8.5"/><circle cx="-8" cy="-26" r="8.5"/>
      <circle cx="10" cy="-26" r="8.5"/><circle cx="25" cy="-13" r="8.5"/>
    </g>
  </defs>
  <rect width="1920" height="1080" fill="#FFF7E8"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- binding -->
  <rect x="0" y="0" width="38" height="1080" fill="#F1DFC0"/>
  <g stroke-linecap="round">
    <g id="ring">
      <circle cx="58" cy="70" r="8" fill="#E2CBA4"/>
      <path d="M58 70 C 38 54, 12 54, 8 70" fill="none" stroke="#9C8F82" stroke-width="8"/>
    </g>
    <use href="#ring" y="80"/><use href="#ring" y="160"/><use href="#ring" y="240"/>
    <use href="#ring" y="320"/><use href="#ring" y="400"/><use href="#ring" y="480"/>
    <use href="#ring" y="560"/><use href="#ring" y="640"/><use href="#ring" y="720"/>
    <use href="#ring" y="800"/><use href="#ring" y="880"/><use href="#ring" y="960"/>
  </g>

  <!-- paw prints, top left -->
  <g opacity="0.75">
    <use href="#paw" transform="translate(286 196) rotate(-30) scale(0.9)"/>
    <use href="#paw" transform="translate(356 128) rotate(-20) scale(0.9)"/>
    <use href="#paw" transform="translate(452 112) rotate(-35) scale(0.9)"/>
    <use href="#paw" transform="translate(520 46) rotate(-25) scale(0.9)"/>
  </g>

  <!-- washi tape with the name -->
  <g transform="translate(1480 74) rotate(6)">
    <rect x="0" y="0" width="380" height="84" fill="#F2B661" opacity="0.92"/>
    <rect x="0" y="0" width="380" height="84" fill="url(#stripes)"/>
    <path d="M0 0 l-8 10 l8 10 l-8 10 l8 10 l-8 10 l8 10 l-8 10 l8 14 M380 0 l8 10 l-8 10 l8 10 l-8 10 l8 10 l-8 10 l8 10 l-8 14" fill="#F2B661" opacity="0.92"/>
    <text x="190" y="58" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="46" fill="#6B4226">Purrfect Bytes</text>
  </g>

  <!-- subscribe, bottom right -->
  <g transform="rotate(-3 1660 990)">
    <text x="1660" y="918" text-anchor="middle" font-family="Caveat" font-weight="700" font-size="52" fill="#6B4226">Learning with me?</text>
    <rect x="1495" y="952" width="330" height="76" rx="38" fill="#DC3232"/>
    <path d="M1532 972 l30 18 l-30 18 Z" fill="#FFFFFF"/>
    <text x="1697" y="1004" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="38" fill="#FFFFFF" letter-spacing="1">SUBSCRIBE</text>
    <path d="M1482 984 C 1480 936, 1838 930, 1846 984 C 1854 1040, 1500 1056, 1480 1000 C 1474 978, 1516 954, 1570 946"
          fill="none" stroke="#6B4226" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- note pointing at the PayPal QR code (only with ?qr) -->
  <g id="qr-note" display="none" fill="#6B4226" font-family="Caveat" font-weight="700" font-size="60">
    <text x="366" y="944">Enjoying this?</text>
    <text x="366" y="1004">Scan to support!</text>
    <path d="M358 1018 C 326 1036, 284 1012, 270 975 M270 975 L267 1003 M270 975 L293 991"
          fill="none" stroke="#6B4226" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
<script>if (location.search.includes('qr')) document.getElementById('qr-note').setAttribute('display', 'inline');</script>
</body></html>
