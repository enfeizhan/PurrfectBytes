<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=block" rel="stylesheet">
<style>html,body{margin:0;width:1280px;height:720px;overflow:hidden}svg{display:block}</style>
</head><body>
<!-- B: Study journal. Dot-grid page with spiral binding, washi tape carrying the name, a pencil and paw prints. -->
<svg width="1280" height="720" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="22" r="2.6" fill="#E9D2AA"/>
    </pattern>
    <pattern id="stripes" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="11" height="22" fill="#FFFFFF" opacity="0.28"/>
    </pattern>
    <g id="paw" fill="#E7B98A">
      <ellipse cx="0" cy="10" rx="22" ry="18"/>
      <circle cx="-24" cy="-14" r="8.5"/><circle cx="-8" cy="-26" r="8.5"/>
      <circle cx="10" cy="-26" r="8.5"/><circle cx="25" cy="-13" r="8.5"/>
    </g>
  </defs>
  <rect width="1920" height="1080" fill="#FFF7E8"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- binding -->
  <rect x="0" y="0" width="38" height="1080" fill="#F1DFC0"/>
  <g stroke-linecap="round">
    <g id="ring">
      <circle cx="58" cy="70" r="8" fill="#E2CBA4"/>
      <path d="M58 70 C 38 54, 12 54, 8 70" fill="none" stroke="#9C8F82" stroke-width="8"/>
    </g>
    <use href="#ring" y="80"/><use href="#ring" y="160"/><use href="#ring" y="240"/>
    <use href="#ring" y="320"/><use href="#ring" y="400"/><use href="#ring" y="480"/>
    <use href="#ring" y="560"/><use href="#ring" y="640"/><use href="#ring" y="720"/>
    <use href="#ring" y="800"/><use href="#ring" y="880"/><use href="#ring" y="960"/>
  </g>

  <!-- paw prints, top left -->
  <g opacity="0.75">
    <use href="#paw" transform="translate(286 196) rotate(-30) scale(0.9)"/>
    <use href="#paw" transform="translate(356 128) rotate(-20) scale(0.9)"/>
    <use href="#paw" transform="translate(452 112) rotate(-35) scale(0.9)"/>
    <use href="#paw" transform="translate(520 46) rotate(-25) scale(0.9)"/>
  </g>

  <!-- washi tape with the name -->
  <g transform="translate(1480 74) rotate(6)">
    <rect x="0" y="0" width="380" height="84" fill="#F2B661" opacity="0.92"/>
    <rect x="0" y="0" width="380" height="84" fill="url(#stripes)"/>
    <path d="M0 0 l-8 10 l8 10 l-8 10 l8 10 l-8 10 l8 10 l-8 10 l8 14 M380 0 l8 10 l-8 10 l8 10 l-8 10 l8 10 l-8 10 l8 10 l-8 14" fill="#F2B661" opacity="0.92"/>
    <text x="190" y="58" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="46" fill="#6B4226">Purrfect Bytes</text>
  </g>

  <!-- pencil -->
  <g transform="translate(1440 1004) rotate(-10)" stroke="#6B4226" stroke-width="5" stroke-linejoin="round">
    <rect x="-44" y="0" width="44" height="38" rx="8" fill="#F29C9C"/>
    <rect x="-8" y="0" width="18" height="38" fill="#C8C0B6"/>
    <rect x="10" y="0" width="320" height="38" fill="#F2C14E"/>
    <line x1="10" y1="19" x2="330" y2="19" stroke="#E0A93A" stroke-width="4"/>
    <path d="M330 0 L388 19 L330 38 Z" fill="#F4DAB0"/>
    <path d="M368 12 L388 19 L368 26 Z" fill="#50321E" stroke="none"/>
  </g>
</svg>
</body></html>
